name: Build Backend
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -o pansou-server .
      - uses: actions/upload-artifact@v4
        with:
          name: pansou-server
          path: pansou-server
